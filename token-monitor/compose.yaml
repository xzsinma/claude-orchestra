# docker compose up -d   ->   http://127.0.0.1:4317
# Reads ~/.claude/projects by default. To change it (or your time zone), copy .env.example to .env.
services:
  token-monitor:
    build: .
    image: claude-token-monitor:local
    restart: unless-stopped
    # Published on the host's loopback only: never reachable from your network.
    ports:
      - "127.0.0.1:${TOKEN_MONITOR_PORT:-4317}:4317"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      # transcripts, read-only (HOME on macOS/Linux, USERPROFILE on Windows)
      - ${CLAUDE_PROJECTS_DIR:-${HOME:-${USERPROFILE}}/.claude/projects}:/data/projects:ro
      - state:/state                                                               # calibration only
      - ./out:/out                                                                 # Excel exports
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100

volumes:
  state:
